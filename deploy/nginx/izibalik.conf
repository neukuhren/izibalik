# Izibalik: статика Mini App + legal; API — на будущий бэкенд (127.0.0.1:8787).

server {
    listen 80;
    listen [::]:80;
    server_name izibalik.shop www.izibalik.shop vm1255887.hosted-by.u1host.com;

    root /opt/projects/izibalik/app/dist;
    index index.html;

    # Разрешить открытие Mini App во встроенном WebView Telegram
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me https://*.t.me" always;

    location = /docs {
        default_type text/html;
        alias /opt/projects/izibalik/legal/docs.html;
    }
    location = /privacy {
        default_type text/html;
        alias /opt/projects/izibalik/legal/privacy.html;
    }
    location = /terms {
        default_type text/html;
        alias /opt/projects/izibalik/legal/terms.html;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8787;
    }

    # Заглушка оплаты (PAYMENT_PROVIDER=stub)
    location /pay-mock/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
