# Шаблон vhost для izibalik. Подставьте IZIBALIK_ROOT и server_name при установке.
# После certbot блок listen 443 будет добавлен автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name vm1255887.hosted-by.u1host.com;

    root /opt/projects/izibalik/app/dist;
    index index.html;

    location = /docs {
        default_type text/html;
        alias /opt/projects/izibalik/legal/docs.html;
    }
    location = /privacy {
        default_type text/html;
        alias /opt/projects/izibalik/legal/privacy.html;
    }
    location = /terms {
        default_type text/html;
        alias /opt/projects/izibalik/legal/terms.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
